<title>HERPICK | Sparkle Your Soul (preview)</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF9F3;--ink:#282326;--burg:#570D29;--gold:#D4B477;--blush:#F4E9E9;--card:#fff;--on-burg:#FFF9F3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1519;--ink:#f3e9ea;--burg:#e8b8c8;--blush:#2b1f25;--card:#261b21;--on-burg:#1d1519;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1519;--ink:#f3e9ea;--burg:#e8b8c8;--blush:#2b1f25;--card:#261b21;--on-burg:#1d1519;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
html,body{overflow-x:hidden;max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}
h1,h2,h3,.serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;margin:0;color:var(--burg)}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid #d4b47766}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:64px}
.logo{font:500 26px "Cormorant Garamond",serif;letter-spacing:.3em;color:var(--burg);text-decoration:none}
.dn{display:none;gap:22px;align-items:center;font-size:13px}.dn a{text-decoration:none}.dn a:hover{color:var(--burg)}
.dd{position:relative;padding:22px 0}.dd>div{display:none;position:absolute;left:0;top:100%;background:var(--bg);border:1px solid #d4b47766;min-width:190px;padding:6px 0;box-shadow:0 10px 30px #0002}.dd:hover>div{display:block}.dd>div a{display:block;padding:8px 18px}.dd>div a:hover{background:var(--blush)}
.icons{display:flex;justify-content:flex-end;align-items:center}
.ib{background:none;border:0;padding:9px;cursor:pointer;position:relative;display:grid;place-items:center;text-decoration:none}
.ib svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6}
.badge{position:absolute;top:1px;right:0;background:var(--burg);color:var(--on-burg);border-radius:9px;font-size:10px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
.ham{margin-left:-9px}
.btn{display:inline-block;border:1px solid var(--burg);background:var(--burg);color:var(--on-burg);padding:12px 26px;font-size:13px;letter-spacing:.03em;cursor:pointer;text-decoration:none;text-align:center;transition:opacity .2s,background .2s}
.btn.o{background:none;color:var(--burg)}.btn:hover{opacity:.88}.btn:focus-visible,.ib:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.w{width:100%}.btn[disabled]{opacity:.45;cursor:not-allowed}
.scrim{position:fixed;inset:0;z-index:50;pointer-events:none}.scrim.on{pointer-events:auto}
.scrim .bg{position:absolute;inset:0;background:#28232688;opacity:0;transition:opacity .3s}.scrim.on .bg{opacity:1}
.scrim aside{position:absolute;left:0;top:0;bottom:0;width:85%;max-width:360px;background:var(--bg);overflow-y:auto;transform:translateX(-100%);transition:transform .3s}.scrim.on aside{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;height:64px;padding:0 20px;border-bottom:1px solid #d4b47755}
.scrim nav{padding:6px 20px}.scrim nav a,.scrim nav button{display:flex;justify-content:space-between;width:100%;padding:13px 0;font:500 21px "Cormorant Garamond",serif;border:0;border-bottom:1px solid #d4b47733;background:none;text-decoration:none;text-align:left;cursor:pointer}
.sub{background:var(--blush);padding-left:16px}.sub a{font:15px Inter,sans-serif!important;padding:11px 0!important}
.hero{background:var(--blush);overflow:hidden}.hero .wrap{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;padding-top:72px;padding-bottom:72px}
.hero h1{font-size:clamp(44px,6vw,74px);line-height:1.03;margin-top:10px}.hero p.l{font-size:18px;max-width:420px;opacity:.8;margin:18px 0 28px}
.eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--burg);opacity:.7}
.heroimg{position:relative;aspect-ratio:4/5;max-height:540px;background:#570D29;overflow:hidden}.heroimg img{width:100%;height:100%;object-fit:cover}.heroimg{display:grid;place-items:center}.heroimg img.herologo{width:64%;height:auto;aspect-ratio:1;border-radius:50%;object-fit:contain;box-shadow:0 0 0 1px #D4B47766,0 24px 60px #0006}.heroimg:after{content:"";position:absolute;inset:12px;border:1px solid #D4B477aa;pointer-events:none}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.rise{animation:rise .8s ease-out both}.r2{animation-delay:.15s}.r3{animation-delay:.3s}
section.s{margin-top:80px}.sh{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:30px;gap:12px}.sh h2{font-size:clamp(30px,4vw,46px)}.sh small{display:block;opacity:.6;font-size:13px;margin-top:2px}.sh a{font-size:13px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:36px 20px}
.pc{min-width:0}.im{position:relative;aspect-ratio:4/5;background:var(--blush);overflow:hidden}
.im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .9s ease-out,opacity .5s}.im img.b{opacity:0}.pc:hover .im img.a{transform:scale(1.05)}.pc:hover .im img.b{opacity:1}
.pc .t{text-align:center;padding-top:12px}.pc .n{display:block;font:500 20px "Cormorant Garamond",serif;text-decoration:none;color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pc .n:hover{color:var(--burg)}.pc .pr{color:var(--burg);font-size:14px}
.tag{position:absolute;top:12px;left:12px;background:var(--ink);color:var(--bg);font-size:11px;padding:3px 10px;z-index:2}
.heart{position:absolute;top:12px;right:12px;background:var(--bg);border:0;border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--burg);z-index:2;font-size:17px;transition:transform .2s}.heart:hover{transform:scale(1.1)}
.addbar{position:absolute;left:0;right:0;bottom:0;z-index:2;border:0;background:#570D29f2;color:#FFF9F3;padding:12px;font-size:12px;letter-spacing:.06em;cursor:pointer;transition:transform .3s}.addbar[disabled]{background:#282326cc;cursor:not-allowed}

document.addEventListener('input',e=>{const t=e.target;const keep=id=>{const p=t.selectionStart;rerender();const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(p,p)}catch(x){}}};
 if(t.id==='fq'){ui.q=t.value;keep('fq')}else if(t.id==='fmax'){ui.max=t.value;keep('fmax')}else if(t.id==='hq'){ui.q=t.value}else if(t.id==='nl'){ui.nl=t.value}else if(t.dataset.f){ui.form[t.dataset.f]=t.value}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='hq'){ui.q=e.target.value;ui.searching=false;if(location.hash==='#shop')rerender();else location.hash='shop'}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.dataset.form==='nl'){const m=ui.nl.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(m)){ui.nlmsg='Please enter a valid email address.'}else{if(!S.subs.some(s=>s.email===m))S.subs.push({email:m,createdAt:Date.now()});save();ui.nl='';ui.nlmsg='Thank you for subscribing.'}rerender()}});
document.addEventListener('change',async e=>{const t=e.target,a=t.dataset.act;
 if(t.id==='fsort'){ui.sort=t.value;rerender()}else if(t.dataset.f==='payment'){ui.form.payment=t.value}
 else if(a==='ostat'){S.orders.find(o=>o.id===t.dataset.id).status=t.value;save();toast('Status updated')}
 else if(a==='stock'){P(t.dataset.id).stock=Math.max(0,Math.floor(+t.value||0));save();toast('Stock updated')}
 else if(a==='sold'){P(t.dataset.id).soldOut=t.checked;save();toast('Updated')}
 else if(t.id==='ai'){ui.fv=readForm();for(const f of [...t.files])ui.files.push(await shrink(f));rerender()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT'||b.tagName==='INPUT')return;const a=b.dataset.act,id=b.dataset.id;
 if(a==='menu'){ui.menu=!ui.menu;rerender()}else if(a==='cats'){ui.catsOpen=!ui.catsOpen;rerender()}
 else if(a==='search'){ui.searching=!ui.searching;rerender();const n=document.getElementById('hq');if(n)n.focus()}
 else if(a==='wish'){S.wish=S.wish.includes(id)?S.wish.filter(w=>w!==id):[...S.wish,id];save();rerender()}
 else if(a==='add'||a==='buy'){const p=P(id);if(!p||out(p)){toast('Sorry, this piece is sold out');return}const q=+b.dataset.q||1,ex=S.cart.find(l=>l.id===id),n=Math.min((ex?ex.qty:0)+q,p.stock);if(ex)ex.qty=n;else S.cart.push({id,qty:n});save();if(a==='buy')location.hash='checkout';else{rerender();toast('Added to cart')}}
 else if(a==='img'){ui.img=+b.dataset.i;rerender()}
 else if(a==='pq'){ui.qty=Math.max(1,Math.min(+b.dataset.max||99,ui.qty+ +b.dataset.d));rerender()}
 else if(a==='cq'){const l=S.cart.find(l=>l.id===id),p=P(id);l.qty=Math.max(1,Math.min(p.stock,l.qty+ +b.dataset.d));save();rerender()}
 else if(a==='rm'){S.cart=S.cart.filter(l=>l.id!==id);save();rerender()}
 else if(a==='place'){const f=ui.form,er={};if(f.name.trim().length<2)er.name='Enter your full name';if(!/^(\+92|0)?3\d{9}$/.test(f.phone.replace(/[\s-]/g,'')))er.phone='Enter a valid Pakistani mobile number, e.g. 0300 1234567';if(!f.city.trim())er.city='Enter your city';if(f.address.trim().length<10)er.address='Enter your full delivery address';ui.errs=er;
  if(Object.keys(er).length){rerender();return}
  const items=cartLines().map(l=>({id:l.id,name:l.p.name,price:l.p.price,qty:l.qty})),total=cartTotal(),oid='HP'+Math.random().toString(36).slice(2,7).toUpperCase();
  S.orders.unshift({id:oid,...f,items,total,status:'Pending',createdAt:Date.now()});S.my.unshift(oid);S.cart=[];save();ui.done=oid;
  if(b.dataset.wa&&S.settings.whatsapp){window.open(wa(`Hello HERPICK, I would like to order (Order ${oid}):\n${items.map(i=>`- ${i.name} x ${i.qty} = ${pkr(i.price*i.qty)}`).join('\n')}\nTotal: ${pkr(total)}\n\nName: ${f.name}\nPhone: ${f.phone}\nCity: ${f.city}\nAddress: ${f.address}\nPayment: ${f.payment}`),'_blank')}
  rerender()}
 else if(a==='cmsg'){const n=val('cn').trim(),m=val('cm').trim();if(n.length<2||m.length<5){document.getElementById('ce').textContent='Please enter your name and a message.';return}window.open(wa(`Hello HERPICK, I'm ${n}.\n${m}`),'_blank')}
 else if(a==='login'){S.admin=true;save();location.hash='admin-overview'}
 else if(a==='logout'){S.admin=false;save();location.hash='home'}
 else if(a==='atab'){ui.edit=null;ui.files=[];ui.keep=[];ui.fv=null;ui.aerr='';ui.cf=null;ui.ce=null;A(b.dataset.t)}
 else if(a==='newp'){ui.edit=null;ui.files=[];ui.keep=[];ui.fv=null;ui.aerr='';A('form')}
 else if(a==='editp'){ui.edit=id;ui.keep=[...P(id).images];ui.files=[];ui.fv=null;ui.aerr='';A('form')}
 else if(a==='cancelp'){ui.edit=null;ui.files=[];ui.keep=[];ui.fv=null;A('products')}
 else if(a==='delp'){if(ui.cf===id){S.products=S.products.filter(p=>p.id!==id);S.cart=S.cart.filter(l=>l.id!==id);ui.cf=null;save();toast('Product deleted')}else ui.cf=id;rerender()}
 else if(a==='rmimg'){const i=+b.dataset.i;ui.fv=readForm();if(i<ui.keep.length)ui.keep.splice(i,1);else ui.files.splice(i-ui.keep.length,1);rerender()}
 else if(a==='savep'){const v=readForm();ui.fv=v;if(v.name.trim().length<2)ui.aerr='Enter a product name.';else if(!(+v.price>0))ui.aerr='Enter a price in PKR greater than 0.';else if(!(+v.stock>=0)||!Number.isInteger(+v.stock))ui.aerr='Stock must be a whole number, 0 or more.';else ui.aerr='';
  if(ui.aerr){rerender();return}
  const imgs=ui.keep.concat(ui.files),d={name:v.name.trim(),price:+v.price,stock:+v.stock,category:v.category,description:v.description.trim(),soldOut:v.soldOut,bestSeller:v.bestSeller,images:imgs.length?imgs:[art('ring','#570D29','#D4B477')]};
  if(ui.edit)Object.assign(P(ui.edit),d);else S.products.unshift({id:'p'+Date.now(),createdAt:Date.now(),...d});
  save();ui.edit=null;ui.files=[];ui.keep=[];ui.fv=null;toast('Saved. Storefront updated');A('products')}
 else if(a==='addcat'){const n=val('newcat').trim(),i=slug(n);if(!i)ui.cmsg='Enter a category name.';else if(S.categories.some(c=>c.id===i))ui.cmsg='That category already exists.';else{S.categories.push({id:i,name:n});ui.cmsg='';save();toast('Category added')}rerender()}
 else if(a==='editcat'){ui.ce=id;ui.cf=null;rerender()}else if(a==='cancelcat'){ui.ce=null;rerender()}
 else if(a==='savecat'){const n=val('cen').trim();if(!n){ui.cmsg='Category name cannot be empty.'}else{S.categories.find(c=>c.id===id).name=n;ui.cmsg='';ui.ce=null;save();toast('Category updated')}rerender()}
 else if(a==='delcat'){if(ui.cf===id){S.categories=S.categories.filter(c=>c.id!==id);ui.cf=null;save();toast('Category deleted')}else ui.cf=id;rerender()}
 else if(a==='sets'){const w=val('sw').replace(/\D/g,'');if(w&&!/^\d{10,15}$/.test(w)){document.getElementById('se').textContent='Enter number with country code, e.g. 923001234567';return}S.settings.whatsapp=w;save();toast('Settings saved')}});
route();
</script></body></html>
